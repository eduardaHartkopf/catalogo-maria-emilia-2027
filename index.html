<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Catálogo Maria Emília - Inverno 2027</title>

  <meta
    name="description"
    content="Catálogo Inverno 2027 Maria Emília"
  >

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>

    :root {
      --ink: #2c2928;
      --wine: #8e4b5a;
      --line: #ded8d4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);

      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #f4f2f0 45%,
          #ebe7e4 100%
        );

      overflow: hidden;
    }


    /* ========================================
       APP
    ======================================== */

    .app {
      width: 100%;
      height: 100%;

      display: grid;

      grid-template-rows:
        64px
        minmax(0, 1fr)
        54px;
    }


    /* ========================================
       CABEÇALHO
    ======================================== */

    header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background:
        rgba(255,255,255,.94);

      border-bottom:
        1px solid var(--line);

      position: relative;

      z-index: 50;
    }

    .brand {
      display: flex;

      flex-direction: column;

      line-height: 1.05;
    }

    .brand strong {
      font-size: 17px;

      letter-spacing: .04em;
    }

    .brand span {
      margin-top: 5px;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .18em;

      opacity: .62;
    }

    .actions {
      display: flex;

      align-items: center;

      gap: 8px;
    }

    button {
      appearance: none;

      height: 38px;

      min-width: 38px;

      border:
        1px solid var(--line);

      border-radius: 12px;

      padding: 0 13px;

      background: #fff;

      color: var(--ink);

      cursor: pointer;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    button:hover {
      transform:
        translateY(-1px);

      border-color:
        #c9c0bb;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,.06);
    }

    .primary {
      background:
        var(--wine);

      border-color:
        var(--wine);

      color:
        #ffffff;
    }


    /* ========================================
       ÁREA DO CATÁLOGO
    ======================================== */

    main {
      width: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;

      justify-content: center;
      align-items: center;

      position: relative;

      padding: 0;

      overflow: hidden;
    }


    /* ========================================
       JANELA QUE RECORTA O LIVRO
    ======================================== */

    #bookViewport {
      position: relative;

      overflow: hidden;

      flex: 0 0 auto;

      display: block;

      margin: 0;

      padding: 0;

      transition:
        width .32s ease,
        height .32s ease;
    }


    /* ========================================
       PAGE FLIP
    ======================================== */

    #book {
      position: relative;

      display: block;

      flex: 0 0 auto;

      margin: 0;

      padding: 0;

      transition:
        transform .32s ease;

      filter:
        drop-shadow(
          0
          18px
          28px
          rgba(31,24,20,.18)
        );

      transform-origin:
        left center;
    }


    /*
      Remove espaçamentos externos
      dos elementos criados pelo PageFlip.
    */

    #book > *,
    #book canvas {
      margin: 0 !important;

      padding: 0 !important;
    }

    #book canvas {
      display: block;
    }


    /*
      Não deixa o fundo artificial
      do livro aparecer.
    */

    #book {
      background:
        transparent !important;
    }


    /* ========================================
       AJUDA
    ======================================== */

    .hint {
      position: absolute;

      left: 18px;

      bottom: 8px;

      font-size: 11px;

      opacity: .55;

      pointer-events: none;
    }


    /* ========================================
       RODAPÉ
    ======================================== */

    footer {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 14px;

      padding: 0 16px;
    }

    .counter {
      min-width: 88px;

      text-align: center;

      font-size: 13px;

      font-variant-numeric:
        tabular-nums;
    }

    .mobile-label {
      display: none;
    }


    /* ========================================
       FULLSCREEN
    ======================================== */

    .app:fullscreen {
      width: 100vw;
      height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #f4f2f0 45%,
          #ebe7e4 100%
        );
    }


    /* ========================================
       MOBILE
    ======================================== */

    @media(max-width:720px) {

      .app {
        grid-template-rows:
          58px
          minmax(0, 1fr)
          50px;
      }

      header {
        padding:
          0 12px;
      }

      .brand strong {
        font-size:
          15px;
      }

      .brand span {
        font-size:
          9px;
      }

      main {
        padding:
          8px
          4px
          4px;
      }

      .hint {
        display:
          none;
      }

      .desktop-label {
        display:
          none;
      }

      .mobile-label {
        display:
          inline;
      }

      button {
        height:
          36px;

        border-radius:
          10px;

        padding:
          0 10px;
      }

    }

  </style>

</head>


<body>


<div
  class="app"
  id="catalogApp"
>


  <!-- ========================================
       CABEÇALHO
  ========================================= -->

  <header>

    <div class="brand">

      <strong>
        Maria Emília
      </strong>

      <span>
        Inverno 2027
      </span>

    </div>


    <div class="actions">

      <button
        id="fullscreen"
        class="primary"
        type="button"
        title="Tela cheia"
      >

        <span aria-hidden="true">
          ⛶
        </span>

        <span class="desktop-label">
          Tela cheia
        </span>

        <span class="mobile-label">
          Tela cheia
        </span>

      </button>

    </div>

  </header>



  <!-- ========================================
       CATÁLOGO
  ========================================= -->

  <main id="stage">

    <div id="bookViewport">

      <div id="book"></div>

    </div>


    <div class="hint">
      Clique e arraste o canto da página para folhear.
    </div>

  </main>



  <!-- ========================================
       CONTROLES
  ========================================= -->

  <footer>

    <button
      id="prev"
      type="button"
      aria-label="Página anterior"
    >
      ←
    </button>


    <div
      id="counter"
      class="counter"
    >
      1 / 28
    </div>


    <button
      id="next"
      type="button"
      aria-label="Próxima página"
    >
      →
    </button>

  </footer>


</div>



<script>


/* ========================================
   PÁGINAS
======================================== */

const total = 28;


const images = [

  "pagina-01.jpg",

  "pagina-02.jpg",

  "pagina-03.jpg",

  "pagina-04.jpg",

  "pagina-05.jpg",

  "pagina-06.jpg",

  "pagina-07.jpg",

  "pagina-08.jpg",

  "pagina-09.jpg",

  "pagina-10.jpg",

  "pagina-11.jpg",

  "pagina-12.jpg",

  "pagina-13.jpg",

  "pagina-14.jpg",

  "pagina-15.jpg",

  "pagina-16.jpg",

  "pagina-17.jpg",

  "pagina-18.jpg",

  "pagina-19.jpg",

  "pagina-20.jpg",

  "pagina-21.jpg",

  "pagina-22.jpg",

  "pagina-23.jpg",

  "pagina-24.jpg",

  "pagina-25.jpg",

  "pagina-26.jpg",

  "pagina-27.jpg",

  "pagina-28.jpg"

];



/* ========================================
   ELEMENTOS
======================================== */

const app =
  document.getElementById(
    "catalogApp"
  );


const stage =
  document.getElementById(
    "stage"
  );


const bookViewport =
  document.getElementById(
    "bookViewport"
  );


const bookEl =
  document.getElementById(
    "book"
  );


const counter =
  document.getElementById(
    "counter"
  );


const fullscreenBtn =
  document.getElementById(
    "fullscreen"
  );



/* ========================================
   VARIÁVEIS
======================================== */

let flip =
  null;


let resizeTimer =
  null;


/*
  Tamanho REAL de uma página.
*/

let pageWidth =
  0;


let pageHeight =
  0;


/*
  Guarda a página atual.
*/

let currentPage =
  0;


/*
  A4
*/

const PAGE_RATIO =
  210 / 297;



/* ========================================
   TAMANHO
======================================== */

function getSize() {


  const mobile =
    window.innerWidth <= 720;


  const availableHeight =
    Math.max(
      340,
      stage.clientHeight - 8
    );


  const availableWidth =
    Math.max(
      280,
      stage.clientWidth - 8
    );


  /*
    Usa praticamente toda
    a altura disponível.
  */

  let h =
    Math.min(
      availableHeight,
      790
    );


  let w =
    h *
    PAGE_RATIO;



  /*
    MOBILE
  */

  if (mobile) {


    if (
      w >
      availableWidth
    ) {


      w =
        availableWidth;


      h =
        w /
        PAGE_RATIO;


    }


  }


  /*
    DESKTOP
  */

  else {


    if (
      (w * 2) >
      availableWidth
    ) {


      w =
        availableWidth /
        2;


      h =
        w /
        PAGE_RATIO;


    }


  }



  return {

    w:
      Math.floor(w),

    h:
      Math.floor(h),

    mobile

  };

}



/* ========================================
   DEFINE A JANELA VISÍVEL
======================================== */

function applyBookView(
  index
) {


  currentPage =
    Math.max(
      0,
      Math.min(
        index,
        total - 1
      )
    );


  counter.textContent =
    (currentPage + 1)
    +
    " / "
    +
    total;



  /*
    No celular o livro já trabalha
    com uma única página.
  */

  if (
    window.innerWidth <= 720
  ) {


    bookViewport.style.width =
      pageWidth +
      "px";


    bookViewport.style.height =
      pageHeight +
      "px";


    bookEl.style.transform =
      "translateX(0)";


    return;

  }



  /*
    PÁGINA 1

    O PageFlip coloca a capa
    na metade direita do livro.

    A janela fica com largura
    de uma página e deslocamos
    o livro para mostrar somente ela.
  */

  if (
    currentPage === 0
  ) {


    bookViewport.style.width =
      pageWidth +
      "px";


    bookViewport.style.height =
      pageHeight +
      "px";


    bookEl.style.transform =
      "translateX(-" +
      pageWidth +
      "px)";


    return;

  }



  /*
    ÚLTIMA PÁGINA

    Ela fica sozinha no lado esquerdo.

    A metade branca à direita
    fica fora da janela.
  */

  if (
    currentPage ===
    total - 1
  ) {


    bookViewport.style.width =
      pageWidth +
      "px";


    bookViewport.style.height =
      pageHeight +
      "px";


    bookEl.style.transform =
      "translateX(0)";


    return;

  }



  /*
    PÁGINAS INTERNAS

    Mostra o livro inteiro:
    esquerda + direita.
  */

  bookViewport.style.width =
    (pageWidth * 2) +
    "px";


  bookViewport.style.height =
    pageHeight +
    "px";


  bookEl.style.transform =
    "translateX(0)";

}



/* ========================================
   INICIA O LIVRO
======================================== */

function initBook() {


  if (
    !window.St ||
    !St.PageFlip
  ) {


    setTimeout(
      initBook,
      150
    );


    return;

  }



  const size =
    getSize();


  pageWidth =
    size.w;


  pageHeight =
    size.h;



  bookEl.style.width =
    size.mobile

      ? pageWidth +
        "px"

      : (pageWidth * 2) +
        "px";


  bookEl.style.height =
    pageHeight +
    "px";



  /*
    Antes mesmo do PageFlip aparecer,
    já colocamos o viewport no tamanho
    correto da capa.
  */

  bookViewport.style.width =
    pageWidth +
    "px";


  bookViewport.style.height =
    pageHeight +
    "px";



  flip =
    new St.PageFlip(
      bookEl,
      {

        width:
          pageWidth,

        height:
          pageHeight,


        size:
          "fixed",


        minWidth:
          240,

        maxWidth:
          900,


        minHeight:
          340,

        maxHeight:
          1273,


        showCover:
          true,


        usePortrait:
          size.mobile,


        mobileScrollSupport:
          true,


        drawShadow:
          true,


        maxShadowOpacity:
          .35,


        flippingTime:
          650,


        useMouseEvents:
          true,


        clickEventForward:
          true,


        showPageCorners:
          true,


        startPage:
          0

      }
    );



  flip.loadFromImages(
    images
  );



  /*
    Quando a página termina
    de virar.
  */

  flip.on(
    "flip",
    function(e) {


      applyBookView(
        e.data
      );


    }
  );



  /*
    Inicializa a capa.
  */

  applyBookView(
    0
  );

}



/* ========================================
   NAVEGAÇÃO
======================================== */

document
  .getElementById(
    "prev"
  )
  .addEventListener(
    "click",
    function() {


      if (flip) {

        flip.flipPrev();

      }


    }
  );


document
  .getElementById(
    "next"
  )
  .addEventListener(
    "click",
    function() {


      if (flip) {

        flip.flipNext();

      }


    }
  );



/* ========================================
   TECLADO
======================================== */

document.addEventListener(
  "keydown",
  function(e) {


    if (!flip) {
      return;
    }


    if (
      e.key ===
      "ArrowLeft"
    ) {


      flip.flipPrev();


    }


    if (
      e.key ===
      "ArrowRight"
    ) {


      flip.flipNext();


    }


  }
);



/* ========================================
   TELA CHEIA
======================================== */

fullscreenBtn
  .addEventListener(
    "click",
    async function() {


      if (flip) {


        currentPage =
          flip
            .getCurrentPageIndex();


      }


      try {


        if (
          !document
            .fullscreenElement
        ) {


          await app
            .requestFullscreen();


        }


        else {


          await document
            .exitFullscreen();


        }


      }


      catch(e) {


        console.error(
          "Erro ao abrir tela cheia:",
          e
        );


      }


    }
  );



/* ========================================
   RECALCULA DEPOIS DO FULLSCREEN
======================================== */

document.addEventListener(
  "fullscreenchange",
  function() {


    clearTimeout(
      resizeTimer
    );


    /*
      O navegador precisa terminar
      a transição antes de medirmos
      a nova área.
    */

    resizeTimer =
      setTimeout(
        function() {


          if (!flip) {
            return;
          }


          const size =
            getSize();



          /*
            Atualiza as variáveis também.

            Esta parte estava faltando
            no código anterior.
          */

          pageWidth =
            size.w;


          pageHeight =
            size.h;



          /*
            Atualiza a caixa externa.
          */

          bookEl.style.width =
            size.mobile

              ? pageWidth +
                "px"

              : (pageWidth * 2) +
                "px";


          bookEl.style.height =
            pageHeight +
            "px";



          /*
            Pede para o PageFlip
            recalcular o canvas.
          */

          if (
            typeof flip.update ===
            "function"
          ) {


            flip.update();


          }



          /*
            Espera o PageFlip recalcular
            e aplica novamente o recorte.
          */

          requestAnimationFrame(
            function() {


              requestAnimationFrame(
                function() {


                  currentPage =
                    flip
                      .getCurrentPageIndex();


                  applyBookView(
                    currentPage
                  );


                }
              );


            }
          );


        },
        250
      );


  }
);



/* ========================================
   RESIZE
======================================== */

window.addEventListener(
  "resize",
  function() {


    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {


          if (!flip) {
            return;
          }


          const size =
            getSize();



          pageWidth =
            size.w;


          pageHeight =
            size.h;



          bookEl.style.width =
            size.mobile

              ? pageWidth +
                "px"

              : (pageWidth * 2) +
                "px";


          bookEl.style.height =
            pageHeight +
            "px";


          if (
            typeof flip.update ===
            "function"
          ) {


            flip.update();


          }


          currentPage =
            flip
              .getCurrentPageIndex();


          requestAnimationFrame(
            function() {


              applyBookView(
                currentPage
              );


            }
          );


        },
        300
      );


  }
);



/* ========================================
   INICIA
======================================== */

initBook();


</script>


</body>

</html>
