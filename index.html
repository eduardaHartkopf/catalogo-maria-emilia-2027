<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Catálogo Maria Emília - Inverno 2027</title>

  <meta
    name="description"
    content="Catálogo Inverno 2027 Maria Emília"
  >

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>

    :root {
      --ink: #2c2928;
      --wine: #8e4b5a;
      --line: #ded8d4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);

      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #f4f2f0 45%,
          #ebe7e4 100%
        );

      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100%;

      display: grid;

      grid-template-rows:
        64px
        minmax(0, 1fr)
        54px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background: rgba(255,255,255,.94);

      border-bottom:
        1px solid var(--line);

      position: relative;

      z-index: 50;
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }

    .brand strong {
      font-size: 17px;
      letter-spacing: .04em;
    }

    .brand span {
      margin-top: 5px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .18em;
      opacity: .62;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      appearance: none;

      height: 38px;
      min-width: 38px;

      border:
        1px solid var(--line);

      border-radius: 12px;

      padding: 0 13px;

      background: #fff;
      color: var(--ink);

      cursor: pointer;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    button:hover {
      transform:
        translateY(-1px);

      border-color:
        #c9c0bb;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,.06);
    }

    .primary {
      background:
        var(--wine);

      border-color:
        var(--wine);

      color:
        #ffffff;
    }

    main {
      width: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;

      justify-content: center;
      align-items: center;

      position: relative;

      padding: 0;

      overflow: hidden;
    }

    #bookViewport {
      position: relative;

      overflow: hidden;

      flex: 0 0 auto;

      display: block;

      margin: 0;
      padding: 0;

      transition:
        width .32s ease,
        height .32s ease;
    }

    #book {
      position: relative;

      display: block;

      flex: 0 0 auto;

      margin: 0;
      padding: 0;

      transition:
        transform .32s ease;

      filter:
        drop-shadow(
          0
          18px
          28px
          rgba(31,24,20,.18)
        );

      transform-origin:
        left center;

      background:
        transparent !important;
    }

    #book > *,
    #book canvas {
      margin: 0 !important;
      padding: 0 !important;
    }

    #book canvas {
      display: block;
    }

    .mobile-page {
      width: 100%;
      height: 100%;

      background: #fff;

      overflow: hidden;
    }

    .mobile-page img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: contain;

      background: #fff;

      user-select: none;
      -webkit-user-drag: none;

      image-rendering: auto;

      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .hint {
      position: absolute;

      left: 18px;
      bottom: 8px;

      font-size: 11px;

      opacity: .55;

      pointer-events: none;
    }

    footer {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 14px;

      padding: 0 16px;
    }

    .counter {
      min-width: 88px;

      text-align: center;

      font-size: 13px;

      font-variant-numeric:
        tabular-nums;
    }

    .mobile-label {
      display: none;
    }

    .app:fullscreen {
      width: 100vw;
      height: 100vh;

      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #f4f2f0 45%,
          #ebe7e4 100%
        );
    }

    @media(max-width:720px) {

      .app {
        grid-template-rows:
          58px
          minmax(0, 1fr)
          50px;
      }

      header {
        padding:
          0 12px;
      }

      .brand strong {
        font-size:
          15px;
      }

      .brand span {
        font-size:
          9px;
      }

      main {
        padding:
          4px 0 0;
      }

      .hint {
        display:
          none;
      }

      .desktop-label {
        display:
          none;
      }

      .mobile-label {
        display:
          inline;
      }

      button {
        height:
          36px;

        border-radius:
          10px;

        padding:
          0 10px;
      }

      #book {
        filter:
          drop-shadow(
            0
            8px
            14px
            rgba(31,24,20,.14)
          );
      }

    }

  </style>

</head>


<body>


<div
  class="app"
  id="catalogApp"
>


  <header>

    <div class="brand">

      <strong>
        Maria Emília
      </strong>

      <span>
        Inverno 2027
      </span>

    </div>


    <div class="actions">

      <button
        id="fullscreen"
        class="primary"
        type="button"
        title="Tela cheia"
      >

        <span aria-hidden="true">
          ⛶
        </span>

        <span class="desktop-label">
          Tela cheia
        </span>

        <span class="mobile-label">
          Tela cheia
        </span>

      </button>

    </div>

  </header>



  <main id="stage">

    <div id="bookViewport">

      <div id="book"></div>

    </div>

    <div class="hint">
      Clique e arraste o canto da página para folhear.
    </div>

  </main>



  <footer>

    <button
      id="prev"
      type="button"
      aria-label="Página anterior"
    >
      ←
    </button>


    <div
      id="counter"
      class="counter"
    >
      1 / 28
    </div>


    <button
      id="next"
      type="button"
      aria-label="Próxima página"
    >
      →
    </button>

  </footer>


</div>



<script>


/* ========================================
   TOTAL
======================================== */

const total = 28;


/* ========================================
   DESKTOP
======================================== */

const desktopImages = [
  "pagina-01.jpg",
  "pagina-02.jpg",
  "pagina-03.jpg",
  "pagina-04.jpg",
  "pagina-05.jpg",
  "pagina-06.jpg",
  "pagina-07.jpg",
  "pagina-08.jpg",
  "pagina-09.jpg",
  "pagina-10.jpg",
  "pagina-11.jpg",
  "pagina-12.jpg",
  "pagina-13.jpg",
  "pagina-14.jpg",
  "pagina-15.jpg",
  "pagina-16.jpg",
  "pagina-17.jpg",
  "pagina-18.jpg",
  "pagina-19.jpg",
  "pagina-20.jpg",
  "pagina-21.jpg",
  "pagina-22.jpg",
  "pagina-23.jpg",
  "pagina-24.jpg",
  "pagina-25.jpg",
  "pagina-26.jpg",
  "pagina-27.jpg",
  "pagina-28.jpg"
];


/* ========================================
   MOBILE
======================================== */

const mobileImages = [
  "pagina-01-mob.png",
  "pagina-02-mob.png",
  "pagina-03-mob.png",
  "pagina-04-mob.png",
  "pagina-05-mob.png",
  "pagina-06-mob.png",
  "pagina-07-mob.png",
  "pagina-08-mob.png",
  "pagina-09-mob.png",
  "pagina-10-mob.png",
  "pagina-11-mob.png",
  "pagina-12-mob.png",
  "pagina-13-mob.png",
  "pagina-14-mob.png",
  "pagina-15-mob.png",
  "pagina-16-mob.png",
  "pagina-17-mob.png",
  "pagina-18-mob.png",
  "pagina-19-mob.png",
  "pagina-20-mob.png",
  "pagina-21-mob.png",
  "pagina-22-mob.png",
  "pagina-23-mob.png",
  "pagina-24-mob.png",
  "pagina-25-mob.png",
  "pagina-26-mob.png",
  "pagina-27-mob.png",
  "pagina-28-mob.png"
];


/* ========================================
   ELEMENTOS
======================================== */

const app =
  document.getElementById(
    "catalogApp"
  );

const stage =
  document.getElementById(
    "stage"
  );

const bookViewport =
  document.getElementById(
    "bookViewport"
  );

const bookEl =
  document.getElementById(
    "book"
  );

const counter =
  document.getElementById(
    "counter"
  );

const fullscreenBtn =
  document.getElementById(
    "fullscreen"
  );


/* ========================================
   VARIÁVEIS
======================================== */

let flip =
  null;

let resizeTimer =
  null;

let pageWidth =
  0;

let pageHeight =
  0;

let currentPage =
  0;

const PAGE_RATIO =
  210 / 297;


/* ========================================
   MOBILE?
======================================== */

function isMobileMode() {

  return window.innerWidth <= 720;

}


/* ========================================
   TAMANHO
======================================== */

function getSize() {

  const mobile =
    isMobileMode();

  const availableHeight =
    Math.max(
      340,
      stage.clientHeight - 8
    );

  const availableWidth =
    Math.max(
      280,
      stage.clientWidth - 8
    );

  let h =
    Math.min(
      availableHeight,
      790
    );

  let w =
    h *
    PAGE_RATIO;


  if (mobile) {

    /*
      No mobile usamos praticamente
      toda a largura disponível.
    */

    w =
      Math.min(
        availableWidth,
        520
      );

    h =
      w /
      PAGE_RATIO;


    /*
      Se a página ficar alta demais,
      limita pela altura disponível.
    */

    if (
      h >
      availableHeight
    ) {

      h =
        availableHeight;

      w =
        h *
        PAGE_RATIO;

    }

  }


  else {

    if (
      (w * 2) >
      availableWidth
    ) {

      w =
        availableWidth /
        2;

      h =
        w /
        PAGE_RATIO;

    }

  }


  return {

    w:
      Math.floor(w),

    h:
      Math.floor(h),

    mobile

  };

}


/* ========================================
   VIEWPORT
======================================== */

function applyBookView(
  index
) {

  currentPage =
    Math.max(
      0,
      Math.min(
        index,
        total - 1
      )
    );


  counter.textContent =
    (currentPage + 1)
    +
    " / "
    +
    total;


  /*
    MOBILE
  */

  if (
    isMobileMode()
  ) {

    bookViewport.style.width =
      pageWidth +
      "px";

    bookViewport.style.height =
      pageHeight +
      "px";

    bookEl.style.transform =
      "translateX(0)";

    return;

  }


  /*
    CAPA DESKTOP
  */

  if (
    currentPage === 0
  ) {

    bookViewport.style.width =
      pageWidth +
      "px";

    bookViewport.style.height =
      pageHeight +
      "px";

    bookEl.style.transform =
      "translateX(-" +
      pageWidth +
      "px)";

    return;

  }


  /*
    ÚLTIMA PÁGINA
  */

  if (
    currentPage ===
    total - 1
  ) {

    bookViewport.style.width =
      pageWidth +
      "px";

    bookViewport.style.height =
      pageHeight +
      "px";

    bookEl.style.transform =
      "translateX(0)";

    return;

  }


  /*
    PÁGINAS INTERNAS
  */

  bookViewport.style.width =
    (pageWidth * 2) +
    "px";

  bookViewport.style.height =
    pageHeight +
    "px";

  bookEl.style.transform =
    "translateX(0)";

}


/* ========================================
   CRIA PÁGINAS HTML MOBILE
======================================== */

function createMobilePages() {

  bookEl.innerHTML =
    "";


  mobileImages.forEach(
    function(src, index) {

      const page =
        document.createElement(
          "div"
        );


      page.className =
        "mobile-page";


      const img =
        document.createElement(
          "img"
        );


      img.src =
        src;


      img.alt =
        "Página " +
        (index + 1) +
        " do Catálogo Inverno 2027";


      img.loading =
        index <= 2
          ? "eager"
          : "lazy";


      img.decoding =
        "async";


      img.draggable =
        false;


      page.appendChild(
        img
      );


      bookEl.appendChild(
        page
      );

    }
  );

}


/* ========================================
   INICIA
======================================== */

function initBook() {

  if (
    !window.St ||
    !St.PageFlip
  ) {

    setTimeout(
      initBook,
      150
    );

    return;

  }


  const size =
    getSize();


  pageWidth =
    size.w;


  pageHeight =
    size.h;


  bookEl.style.width =
    size.mobile

      ? pageWidth +
        "px"

      : (pageWidth * 2) +
        "px";


  bookEl.style.height =
    pageHeight +
    "px";


  bookViewport.style.width =
    pageWidth +
    "px";


  bookViewport.style.height =
    pageHeight +
    "px";


  flip =
    new St.PageFlip(
      bookEl,
      {

        width:
          pageWidth,

        height:
          pageHeight,

        size:
          "fixed",

        minWidth:
          240,

        maxWidth:
          900,

        minHeight:
          340,

        maxHeight:
          1273,

        showCover:
          true,

        usePortrait:
          size.mobile,

        mobileScrollSupport:
          true,

        drawShadow:
          true,

        maxShadowOpacity:
          .35,

        flippingTime:
          650,

        useMouseEvents:
          true,

        clickEventForward:
          true,

        showPageCorners:
          true,

        startPage:
          0

      }
    );


  /*
    DESKTOP:
    continua exatamente usando
    loadFromImages.
  */

  if (
    !size.mobile
  ) {

    flip.loadFromImages(
      desktopImages
    );

  }


  /*
    MOBILE:
    renderiza as imagens
    como elementos HTML reais.
  */

  else {

    createMobilePages();


    const pages =
      bookEl.querySelectorAll(
        ".mobile-page"
      );


    flip.loadFromHTML(
      pages
    );

  }


  flip.on(
    "flip",
    function(e) {

      applyBookView(
        e.data
      );

    }
  );


  applyBookView(
    0
  );

}


/* ========================================
   NAVEGAÇÃO
======================================== */

document
  .getElementById(
    "prev"
  )
  .addEventListener(
    "click",
    function() {

      if (flip) {

        flip.flipPrev();

      }

    }
  );


document
  .getElementById(
    "next"
  )
  .addEventListener(
    "click",
    function() {

      if (flip) {

        flip.flipNext();

      }

    }
  );


/* ========================================
   TECLADO
======================================== */

document.addEventListener(
  "keydown",
  function(e) {

    if (!flip) {
      return;
    }


    if (
      e.key ===
      "ArrowLeft"
    ) {

      flip.flipPrev();

    }


    if (
      e.key ===
      "ArrowRight"
    ) {

      flip.flipNext();

    }

  }
);


/* ========================================
   FULLSCREEN
======================================== */

fullscreenBtn
  .addEventListener(
    "click",
    async function() {

      if (flip) {

        currentPage =
          flip
            .getCurrentPageIndex();

      }


      try {

        if (
          !document
            .fullscreenElement
        ) {

          await app
            .requestFullscreen();

        }

        else {

          await document
            .exitFullscreen();

        }

      }


      catch(e) {

        console.error(
          "Erro ao abrir tela cheia:",
          e
        );

      }

    }
  );


/* ========================================
   FULLSCREEN CHANGE
======================================== */

document.addEventListener(
  "fullscreenchange",
  function() {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {

          if (!flip) {
            return;
          }


          const size =
            getSize();


          pageWidth =
            size.w;


          pageHeight =
            size.h;


          bookEl.style.width =
            size.mobile

              ? pageWidth +
                "px"

              : (pageWidth * 2) +
                "px";


          bookEl.style.height =
            pageHeight +
            "px";


          if (
            typeof flip.update ===
            "function"
          ) {

            flip.update();

          }


          currentPage =
            flip
              .getCurrentPageIndex();


          requestAnimationFrame(
            function() {

              applyBookView(
                currentPage
              );

            }
          );

        },
        250
      );

  }
);


/* ========================================
   RESIZE
======================================== */

window.addEventListener(
  "resize",
  function() {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {

          if (!flip) {
            return;
          }


          const size =
            getSize();


          pageWidth =
            size.w;


          pageHeight =
            size.h;


          bookEl.style.width =
            size.mobile

              ? pageWidth +
                "px"

              : (pageWidth * 2) +
                "px";


          bookEl.style.height =
            pageHeight +
            "px";


          if (
            typeof flip.update ===
            "function"
          ) {

            flip.update();

          }


          currentPage =
            flip
              .getCurrentPageIndex();


          applyBookView(
            currentPage
          );

        },
        300
      );

  }
);


/* ========================================
   INICIA
======================================== */

initBook();


</script>


</body>

</html>
