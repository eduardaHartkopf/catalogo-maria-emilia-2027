<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Catálogo Maria Emília - Inverno 2027</title>

  <meta
    name="description"
    content="Catálogo Inverno 2027 Maria Emília"
  >

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>

    :root {
      --bg: #f3f1ef;
      --ink: #2c2928;
      --wine: #8e4b5a;
      --line: #ded8d4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);

      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #f4f2f0 45%,
          #ebe7e4 100%
        );

      overflow: hidden;
    }


    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      height: 100%;

      display: grid;

      grid-template-rows:
        64px
        minmax(0, 1fr)
        54px;
    }


    /* =========================
       TOPO
    ========================= */

    header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 20px;

      background:
        rgba(255,255,255,.94);

      border-bottom:
        1px solid var(--line);

      position: relative;

      z-index: 50;
    }


    .brand {
      display: flex;

      flex-direction: column;

      line-height: 1.05;
    }


    .brand strong {
      font-size: 17px;

      letter-spacing: .04em;
    }


    .brand span {
      margin-top: 5px;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: .18em;

      opacity: .62;
    }


    .actions {
      display: flex;

      align-items: center;

      gap: 8px;
    }


    button {
      appearance: none;

      height: 38px;

      min-width: 38px;

      border:
        1px solid var(--line);

      border-radius: 12px;

      padding:
        0 13px;

      background: #fff;

      color: var(--ink);

      cursor: pointer;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 7px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }


    button:hover {
      transform:
        translateY(-1px);

      border-color:
        #c9c0bb;

      box-shadow:
        0 4px 14px
        rgba(0,0,0,.06);
    }


    .primary {
      background:
        var(--wine);

      border-color:
        var(--wine);

      color:
        #ffffff;
    }


    /* =========================
       PALCO
    ========================= */

    main {
      width: 100%;

      min-height: 0;

      display: flex;

      justify-content: center;

      align-items: center;

      position: relative;

      padding:
        14px
        20px
        8px;

      overflow: hidden;
    }


    /* =========================
       LIVRO
    ========================= */

    #book {
      position: relative;

      filter:
        drop-shadow(
          0
          18px
          28px
          rgba(31,24,20,.18)
        );
    }


    /* =========================
       AJUDA
    ========================= */

    .hint {
      position: absolute;

      left: 18px;

      bottom: 8px;

      font-size: 11px;

      opacity: .55;

      pointer-events: none;
    }


    /* =========================
       RODAPÉ
    ========================= */

    footer {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 14px;

      padding:
        0 16px;
    }


    .counter {
      min-width: 88px;

      text-align: center;

      font-size: 13px;

      font-variant-numeric:
        tabular-nums;
    }


    /* =========================
       MOBILE
    ========================= */

    .mobile-label {
      display: none;
    }


    @media(max-width:720px) {

      .app {
        grid-template-rows:
          58px
          minmax(0, 1fr)
          50px;
      }


      header {
        padding:
          0 12px;
      }


      .brand strong {
        font-size: 15px;
      }


      .brand span {
        font-size: 9px;
      }


      main {
        padding:
          8px
          4px
          4px;
      }


      .hint {
        display: none;
      }


      .desktop-label {
        display: none;
      }


      .mobile-label {
        display: inline;
      }


      button {
        height: 36px;

        border-radius: 10px;

        padding:
          0 10px;
      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- =========================
       CABEÇALHO
  ========================== -->

  <header>


    <div class="brand">

      <strong>
        Maria Emília
      </strong>

      <span>
        Inverno 2027
      </span>

    </div>


    <div class="actions">

      <button
        id="fullscreen"
        class="primary"
        type="button"
        title="Tela cheia"
      >

        <span aria-hidden="true">
          ⛶
        </span>

        <span class="desktop-label">
          Tela cheia
        </span>

        <span class="mobile-label">
          Tela cheia
        </span>

      </button>

    </div>


  </header>


  <!-- =========================
       LIVRO
  ========================== -->

  <main id="stage">

    <div id="book"></div>

    <div class="hint">
      Clique e arraste o canto da página para folhear.
    </div>

  </main>


  <!-- =========================
       NAVEGAÇÃO
  ========================== -->

  <footer>

    <button
      id="prev"
      type="button"
      aria-label="Página anterior"
    >
      ←
    </button>

    <div
      id="counter"
      class="counter"
    >
      1 / 3
    </div>

    <button
      id="next"
      type="button"
      aria-label="Próxima página"
    >
      →
    </button>

  </footer>


</div>



<script>

  /* =========================
     CONFIGURAÇÃO
  ========================= */

  const total = 3;


  const images = [

    "pagina-01.jpg",

    "pagina-02.jpg",

    "pagina-03.jpg"

  ];


  const bookEl =
    document.getElementById(
      "book"
    );


  const stage =
    document.getElementById(
      "stage"
    );


  const fullscreenBtn =
    document.getElementById(
      "fullscreen"
    );


  const counter =
    document.getElementById(
      "counter"
    );


  let flip = null;


  let resizeTimer = null;


  /*
    Enquanto o navegador estiver
    entrando ou saindo de tela cheia,
    o resize normal fica bloqueado.
  */

  let fullscreenTransition =
    false;


  /*
    Guarda a página atual.
  */

  let currentPage =
    0;


  /*
    Proporção A4:
    210 x 297 mm
  */

  const PAGE_RATIO =
    210 / 297;



  /* =========================
     CALCULA TAMANHO
  ========================= */

  function getSize() {


    const mobile =
      window.innerWidth <= 720;


    /*
      Mede o espaço REAL disponível
      dentro da página do catálogo.
    */

    const availableHeight =
      Math.max(
        340,
        stage.clientHeight - 20
      );


    const availableWidth =
      Math.max(
        280,
        stage.clientWidth - 30
      );


    let h =
      Math.min(
        availableHeight,
        790
      );


    let w =
      h *
      PAGE_RATIO;



    /*
      CELULAR:
      uma página.
    */

    if (mobile) {


      if (
        w >
        availableWidth
      ) {


        w =
          availableWidth;


        h =
          w /
          PAGE_RATIO;


      }


    }



    /*
      DESKTOP:
      duas páginas.
    */

    else {


      if (
        (w * 2) >
        availableWidth
      ) {


        w =
          availableWidth /
          2;


        h =
          w /
          PAGE_RATIO;


      }


    }



    return {

      w:
        Math.floor(w),

      h:
        Math.floor(h),

      mobile

    };

  }



  /* =========================
     MONTA O LIVRO
  ========================= */

  function buildBook(
    startPage =
      currentPage
  ) {


    /*
      Espera a biblioteca carregar.
    */

    if (
      !window.St
      ||
      !St.PageFlip
    ) {


      setTimeout(
        function() {

          buildBook(
            startPage
          );

        },
        150
      );


      return;

    }



    /*
      Garante uma página válida.
    */

    startPage =
      Math.max(
        0,
        Math.min(
          startPage,
          total - 1
        )
      );



    /*
      Remove o PageFlip anterior.
    */

    if (flip) {


      try {

        flip.destroy();

      }

      catch(e) {}


      flip = null;


      bookEl.innerHTML =
        "";


    }



    const size =
      getSize();


    const w =
      size.w;


    const h =
      size.h;


    const mobile =
      size.mobile;



    /*
      Dimensão explícita do livro.
    */

    bookEl.style.width =

      mobile

        ? w + "px"

        : (w * 2) +
          "px";


    bookEl.style.height =
      h + "px";



    /*
      Cria o PageFlip.
    */

    flip =
      new St.PageFlip(
        bookEl,
        {

          width:
            w,

          height:
            h,


          size:
            "fixed",


          minWidth:
            240,

          maxWidth:
            900,


          minHeight:
            340,

          maxHeight:
            1273,


          /*
            Capa sozinha.
          */

          showCover:
            true,


          /*
            Uma página no celular.
          */

          usePortrait:
            mobile,


          mobileScrollSupport:
            true,


          /*
            Efeito de sombra da folha.
          */

          drawShadow:
            true,


          maxShadowOpacity:
            .35,


          /*
            Velocidade da animação.
          */

          flippingTime:
            650,


          /*
            Interação.
          */

          useMouseEvents:
            true,


          clickEventForward:
            true,


          /*
            Mantém a página atual
            depois de resize/fullscreen.
          */

          startPage:
            startPage

        }
      );



    /*
      Usa o efeito original
      que ficou bom.
    */

    flip.loadFromImages(
      images
    );



    /*
      Quando vira uma página.
    */

    flip.on(
      "flip",
      function(e) {


        currentPage =
          e.data;


        updateCounter(
          currentPage
        );


      }
    );



    /*
      Quando muda orientação.
    */

    flip.on(
      "changeOrientation",
      function() {


        if (flip) {


          currentPage =
            flip
              .getCurrentPageIndex();


          updateCounter(
            currentPage
          );


        }


      }
    );



    currentPage =
      startPage;


    updateCounter(
      currentPage
    );

  }



  /* =========================
     CONTADOR
  ========================= */

  function updateCounter(
    index
  ) {


    counter.textContent =

      (index + 1)

      +

      " / "

      +

      total;


  }



  /* =========================
     NAVEGAÇÃO
  ========================= */

  document
    .getElementById(
      "prev"
    )
    .addEventListener(
      "click",
      function() {


        if (flip) {

          flip.flipPrev();

        }


      }
    );



  document
    .getElementById(
      "next"
    )
    .addEventListener(
      "click",
      function() {


        if (flip) {

          flip.flipNext();

        }


      }
    );



  /* =========================
     TECLADO
  ========================= */

  document
    .addEventListener(
      "keydown",
      function(e) {


        if (!flip) {

          return;

        }


        if (
          e.key ===
          "ArrowLeft"
        ) {


          flip.flipPrev();


        }


        if (
          e.key ===
          "ArrowRight"
        ) {


          flip.flipNext();


        }


      }
    );



  /* =========================
     TELA CHEIA
  ========================= */

  fullscreenBtn
    .addEventListener(
      "click",
      async function() {


        /*
          Guarda a página atual
          antes do navegador mudar
          o tamanho da tela.
        */

        if (flip) {


          currentPage =
            flip
              .getCurrentPageIndex();


        }



        /*
          Bloqueia os resizes
          intermediários.
        */

        fullscreenTransition =
          true;



        try {


          if (
            !document
              .fullscreenElement
          ) {


            /*
              Entra em tela cheia.
            */

            await document
              .documentElement
              .requestFullscreen();


          }


          else {


            /*
              Sai da tela cheia.
            */

            await document
              .exitFullscreen();


          }


        }


        catch(e) {


          fullscreenTransition =
            false;


        }


      }
    );



  /* =========================
     FULLSCREEN CHANGE
  ========================= */

  /*
    Esta é a correção principal.

    Só recriamos o livro DEPOIS
    que o navegador terminou de
    entrar ou sair da tela cheia.
  */

  document
    .addEventListener(
      "fullscreenchange",
      function() {


        fullscreenTransition =
          true;


        clearTimeout(
          resizeTimer
        );



        /*
          Espera o navegador finalizar
          o cálculo da nova área.
        */

        setTimeout(
          function() {


            requestAnimationFrame(
              function() {


                requestAnimationFrame(
                  function() {


                    buildBook(
                      currentPage
                    );



                    /*
                      Depois que o livro
                      está pronto novamente,
                      liberamos resize normal.
                    */

                    setTimeout(
                      function() {


                        fullscreenTransition =
                          false;


                      },
                      250
                    );


                  }
                );


              }
            );


          },
          180
        );


      }
    );



  /* =========================
     RESIZE NORMAL
  ========================= */

  window
    .addEventListener(
      "resize",
      function() {


        /*
          Ignora os vários resizes
          que acontecem durante
          fullscreen.
        */

        if (
          fullscreenTransition
        ) {


          return;


        }



        clearTimeout(
          resizeTimer
        );



        resizeTimer =
          setTimeout(
            function() {


              if (flip) {


                currentPage =
                  flip
                    .getCurrentPageIndex();


              }



              buildBook(
                currentPage
              );


            },
            300
          );


      }
    );



  /* =========================
     INICIA
  ========================= */

  buildBook(
    0
  );

</script>


</body>

</html>
